name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: extractions/setup-just@v2

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Install grammar deps
        working-directory: grammars/tree-sitter-applescript
        run: npm install

      - name: Verify .scm query node references
        run: just verify

      - name: Run grammar test suite
        run: just test
